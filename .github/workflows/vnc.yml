name: macOS VNC

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Enable VNC and set password
        run: |
          sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw MyPass123
          sudo dscl . -passwd /Users/runner MyPass123 || true

      - name: Screen permissions
        run: |
          for svc in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES ('$svc','com.apple.screensharing.agent',0,2,4,1,'UNUSED',0,strftime('%s','now')),('$svc','/System/Library/CoreServices/screensharingd',1,2,4,1,'UNUSED',0,strftime('%s','now'));" 2>&1 || true
          done

      - name: Virtual display
        run: |
          brew install --cask betterdisplay 2>&1 || true
          open -a BetterDisplay 2>&1 || true
          sleep 15
          /Applications/BetterDisplay.app/Contents/MacOS/BetterDisplay create -type=VirtualScreen -virtualScreenName=Virtual -aspectWidth=16 -aspectHeight=9 -virtualScreenHiDPI=off 2>&1 || true
          sleep 10
          echo "== displays =="
          system_profiler SPDisplaysDataType | head -40 || true
          sudo killall screensharingd 2>/dev/null || true

      - name: Start ngrok tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          brew install ngrok
          ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
          ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 10
          echo "ADDRESS:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'

      - name: Keep machine alive
        run: sleep 21000
